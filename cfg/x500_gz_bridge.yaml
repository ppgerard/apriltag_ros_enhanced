# Bridge the x500_mono_cam camera_info topic from Gazebo to ROS 2 using ros_gz_bridge.
# The camera image itself is bridged separately by ros_gz_image (see x500_gz_bridge.launch.py).

- ros_topic_name: "/sensor/imager/camera_info"
  gz_topic_name: "/world/apriltag/model/x500_mono_cam_0/link/camera_link/sensor/imager/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
